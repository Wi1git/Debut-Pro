# Debut Pro: build options for scripts/build-shotcut-msys2.sh (Windows x64, MSYS2 UCRT64).
# Used by .github/workflows/build-windows.yml, which appends machine-specific
# settings (paths, version, build stage). Changing this file invalidates the
# CI dependency cache.

# Slimmed-down feature set: no speech-to-text, OpenCV tracking, Glaxnimate,
# GoPro GPS import, spatial audio, 360 video, VMAF or AOM (dav1d decodes AV1,
# SVT-AV1 encodes it).
ENABLE_WHISPERCPP=0
ENABLE_OPENCV=0
ENABLE_GLAXNIMATE=0
ENABLE_GOPRO2GPX=0
ENABLE_LIBSPATIALAUDIO=0
ENABLE_BIGSH0T=0
ENABLE_VMAF=0
ENABLE_AOM=0

# Kept (these are the defaults, listed for clarity).
ENABLE_FREI0R=1
ENABLE_MOVIT=1
ENABLE_LADSPA=1
ENABLE_RNNOISE=1

# MLT is pinned so builds are reproducible and the dependency cache is valid.
# Bump this together with the Shotcut sources (needs mlt++ >= 7.36.0).
MLT_HEAD=0
MLT_REVISION="a5639e5efc525c3754feae98791f8be8a4298428"
MLT_ADDITIONAL_OPTIONS="-DMOD_GLAXNIMATE_QT6=OFF -DMOD_OPENCV=OFF"

# GPU video: NVIDIA NVENC/NVDEC (nv-codec-headers), AMD AMF, Intel QSV (oneVPL),
# and Direct3D 11/DXVA2 decoding. Requesting them explicitly makes FFmpeg's
# configure fail instead of silently dropping one.
FFMPEG_ADDITIONAL_OPTIONS="--enable-ffnvcodec --enable-nvenc --enable-nvdec --enable-cuvid --enable-amf --enable-libvpl --enable-d3d11va --enable-dxva2"
