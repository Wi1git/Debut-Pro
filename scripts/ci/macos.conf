# Debut Pro: build options for scripts/build-shotcut.sh (macOS on Apple Silicon).
# Used by .github/workflows/build-macos.yml, which prepends machine-specific
# settings (paths, Qt location, version) and appends the build stage.
# Changing this file invalidates the CI dependency cache.

# Apple Silicon only; the remaining libraries come from Homebrew.
MACOS_ARCHITECTURES="arm64"
MACOS_DEPS_PREFIX="/opt/homebrew"
# Homebrew's libomp is keg-only (not linked into /opt/homebrew/include or lib).
MACOS_OPENMP_INCLUDE_DIR="/opt/homebrew/opt/libomp/include"
MACOS_OPENMP_LIB_DIR="/opt/homebrew/opt/libomp/lib"

# Slimmed-down feature set: no speech-to-text, OpenCV tracking, Glaxnimate,
# GoPro GPS import, spatial audio, 360 video, VMAF or AOM (dav1d decodes AV1,
# SVT-AV1 encodes it).
ENABLE_WHISPERCPP=0
ENABLE_OPENCV=0
ENABLE_GLAXNIMATE=0
ENABLE_GOPRO2GPX=0
ENABLE_LIBSPATIALAUDIO=0
ENABLE_BIGSH0T=0
FFMPEG_SUPPORT_VMAF=0
FFMPEG_SUPPORT_AOM=0

# Kept (these are the defaults, listed for clarity).
FFMPEG_SUPPORT_H264=1
FFMPEG_SUPPORT_H265=1
FFMPEG_SUPPORT_LIBVPX=1
FFMPEG_SUPPORT_OPUS=1
FFMPEG_SUPPORT_MP3=1
FFMPEG_SUPPORT_DAV1D=1
FFMPEG_SUPPORT_SVTAV1=1
FFMPEG_SUPPORT_WEBP=1
FFMPEG_SUPPORT_ZIMG=1
ENABLE_FREI0R=1
ENABLE_MOVIT=1
ENABLE_SWH_PLUGINS=1
ENABLE_VIDSTAB=1
ENABLE_RUBBERBAND=1
ENABLE_ZIMG=1
ENABLE_LIBWEBP=1
ENABLE_RNNOISE=1

# MLT is pinned so builds are reproducible and the dependency cache is valid.
# Bump this together with the Shotcut sources (needs mlt++ >= 7.36.0).
MLT_HEAD=0
MLT_REVISION="a5639e5efc525c3754feae98791f8be8a4298428"
# Homebrew's SDL2 is sdl2-compat, which aborts the process when SDL3 is not
# found next to it, so nothing in the app may link SDL. Audio uses RtAudio
# (CoreAudio) instead, which Shotcut falls back to automatically.
MLT_ADDITIONAL_OPTIONS="-DMOD_GLAXNIMATE_QT6=OFF -DMOD_OPENCV=OFF -DMOD_SDL2=OFF -DCMAKE_DISABLE_FIND_PACKAGE_SDL2=ON"
# melt.c includes SDL.h on macOS even without SDL2; MELT_NOSDL leaves it out.
MLT_ADDITIONAL_CFLAGS="-DMELT_NOSDL"

# VideoToolbox hardware encode/decode and AudioToolbox are on by default on
# macOS; requesting them explicitly makes configure fail if they go missing.
# No SDL (see above; ffplay is not built) and no X11 screen capture, which
# would pull Homebrew's X11 libraries into the app.
FFMPEG_ADDITIONAL_OPTIONS="--enable-videotoolbox --enable-audiotoolbox --disable-sdl2 --disable-libxcb --disable-xlib"

# The workflow signs the app and builds the disk image itself.
ACTION_ARCHIVE=0
ACTION_CLEANUP=0
